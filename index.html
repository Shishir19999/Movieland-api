<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieLand | Search, filter and save movies</title>
    <meta
      name="description"
      content="MovieLand is a movie discovery app with advanced filters, lists, a viewing diary, stats and a quiz. Browse a built-in sample catalogue offline or connect your own OMDb key for live search."
    />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="https://shishir19999.github.io/Movieland-api/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieLand" />
    <meta property="og:title" content="MovieLand | Search, filter and save movies" />
    <meta
      property="og:description"
      content="Browse a sample catalogue or search the OMDb database. Filter, rate, keep lists and a diary, and see your stats."
    />
    <meta property="og:url" content="https://shishir19999.github.io/Movieland-api/" />
    <meta property="og:image" content="https://shishir19999.github.io/Movieland-api/logo512.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      // apply the saved or system theme before first paint to avoid a flash
      try {
        var t = JSON.parse(localStorage.getItem('ml:theme'))
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <noscript>MovieLand needs JavaScript to run. Please enable it and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
