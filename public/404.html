<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | MovieLand</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/Movieland-api/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #0f1117; color: #eef0f6; text-align: center;
      }
      main { max-width: 440px; }
      .code { font-size: 4.5rem; font-weight: 800; color: #f5b942; line-height: 1; }
      h1 { margin: 12px 0 8px; font-family: Georgia, serif; }
      p { color: #a9b0c4; margin: 0 0 24px; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 10px; font-weight: 700;
        background: #f5b942; color: #1a1300; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #8ecbff; outline-offset: 3px; }
      @media (prefers-color-scheme: light) {
        body { background: #f6f5f1; color: #1a1c24; }
        p { color: #4b5266; }
        .code { color: #96580a; }
        a { background: #96580a; color: #fff; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This reel is missing</h1>
      <p>The page you were looking for does not exist. Head back to MovieLand and keep browsing.</p>
      <a href="/Movieland-api/">Back to MovieLand</a>
    </main>
  </body>
</html>
